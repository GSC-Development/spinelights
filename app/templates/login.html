<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign in - Pharos Scheduler</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-100 flex items-center justify-center">
  <form method="post" action="/login" class="bg-white p-8 rounded-xl shadow-md w-full max-w-sm">
    <h1 class="text-xl font-semibold mb-6">Pharos Scheduler</h1>
    {% if error %}
    <div class="mb-4 p-3 bg-red-50 text-red-700 text-sm rounded">{{ error }}</div>
    {% endif %}
    <label class="block mb-3">
      <span class="text-sm text-gray-700">Username</span>
      <input name="username" type="text" autofocus required autocomplete="username"
             class="mt-1 block w-full rounded border-gray-300 shadow-sm focus:ring-blue-500 focus:border-blue-500 px-3 py-2 border">
    </label>
    <label class="block mb-6">
      <span class="text-sm text-gray-700">Password</span>
      <input name="password" type="password" required autocomplete="current-password"
             class="mt-1 block w-full rounded border-gray-300 shadow-sm focus:ring-blue-500 focus:border-blue-500 px-3 py-2 border">
    </label>
    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded">Sign in</button>
  </form>
</body>
</html>
